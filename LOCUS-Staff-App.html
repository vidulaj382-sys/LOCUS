<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOCUS Staff App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--aqua:#22C3E6;--aqua-d:#0E9DBE;--aqua-l:#BFE9F3;--aqua-xl:#E6F8FC;--em:#10B981;--em-d:#0B8A5E;--em-dd:#0A6B49;--em-l:#DDF6EA;--ink:#0B3A4A;--ink2:#3F6572;--ink3:#7A9AA6;--bg:#F4FCFE;--line:#CDEBF3;--amber-l:#FFF1D6;--coral-l:#FFE3E3;--grad:linear-gradient(135deg,#22C3E6 0%,#10B981 100%)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Figtree',system-ui,sans-serif;color:var(--ink);min-height:100dvh;background:linear-gradient(160deg,#E6F8FC 0%,#DDF6EA 100%)}
h2,b.sora,.item b{font-family:'Sora',sans-serif}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
[hidden]{display:none!important}
.stage{min-height:100dvh;display:grid;place-items:center;padding:24px}
.phone{width:410px;border-radius:50px;background:#0B3A4A;padding:10px;box-shadow:0 40px 80px rgba(11,58,74,.28)}
.screen{border-radius:41px;overflow:hidden;background:var(--bg);height:min(844px,calc(100dvh - 68px));min-height:640px;display:flex;flex-direction:column;position:relative}
.sbar{display:flex;justify-content:space-between;padding:12px 26px 0;font-size:12px;font-weight:700;color:#06303D;background:#22C3E6;background:linear-gradient(135deg,#22C3E6,#14BDB5)}
.shead{padding:14px 20px 20px;background:var(--grad);border-radius:0 0 28px 28px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;justify-content:space-between;align-items:center}
.brand div{display:flex;gap:10px;align-items:center}
.brand b{letter-spacing:.14em;color:#06303D;font-family:'Sora';font-size:17px}
#tagbtn{padding:7px 12px;border-radius:999px;background:#fff;color:var(--em-dd);font-size:13px;font-weight:700}
.shead h2{font-size:26px;color:#06303D;line-height:1.2}
.sq{position:relative}
.sq input{width:100%;height:52px;border:0;border-radius:16px;background:#fff;padding:0 16px 0 46px;font:500 16px 'Figtree';color:var(--ink)}
.sq svg{position:absolute;left:16px;top:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.schips{display:flex;gap:8px;padding:14px 20px 0;overflow-x:auto;flex:none}
.chip{height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--aqua-l);background:#fff;font-size:14px;font-weight:600;flex:none}
.chip[aria-pressed=true]{background:var(--em-d);border-color:var(--em-d);color:#fff}
.body{flex:1;min-height:0;overflow-y:auto;padding:14px 20px 96px;display:flex;flex-direction:column;gap:12px}
.pill{display:inline-flex;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;align-items:center}
.pill.g{background:var(--em-l);color:var(--em-dd)}.pill.a{background:var(--amber-l);color:#8A5A00}.pill.r{background:var(--coral-l);color:#B03030}
.item,.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;width:100%;text-align:left;box-shadow:0 6px 16px rgba(34,195,230,.08);transition:.2s}
.item.sel{border-color:var(--em);box-shadow:0 10px 24px rgba(16,185,129,.2)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item b,.panel b{font-size:16px;font-weight:600}
.item small,.panel small{display:block;color:var(--ink2);font-size:13.5px;margin-top:2px}
canvas.mini,#fmap{display:block;width:100%;margin-top:12px;border-radius:14px;border:1px solid var(--line);aspect-ratio:40/24;background:#fff}
#fmap{margin-top:0}
.go{margin-top:12px;width:100%;height:50px;border-radius:14px;background:var(--grad);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.go.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--aqua-l);height:42px;font-size:14px;margin-top:10px}
.bar{height:8px;border-radius:99px;background:#E7F5F9;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;border-radius:99px;transition:width .35s}
.item.dead{opacity:.75}
.empty{text-align:center;color:var(--ink3);padding:30px 10px;font-size:14px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:76px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;padding-bottom:6px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--ink3);position:relative}
.tabbar button.on{color:var(--em-d)}
#badge{position:absolute;top:10px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:99px;background:#EF6A6A;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.toast{position:absolute;left:14px;right:14px;top:56px;background:#fff;border:1px solid #F5A524;border-left:5px solid #F5A524;border-radius:14px;padding:10px 12px;font-size:13px;box-shadow:0 10px 24px rgba(0,0,0,.14);transform:translateY(-14px);opacity:0;pointer-events:none;transition:.35s;z-index:5}
.toast.on{transform:none;opacity:1}
@media(max-width:480px){.stage{padding:0}.phone{width:100%;border-radius:0;padding:0;box-shadow:none;background:none}.screen{border-radius:0;height:100dvh}.sbar{display:none}.shead{padding-top:max(18px,env(safe-area-inset-top))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="stage"><div class="phone"><div class="screen">
  <div class="sbar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <div class="toast" id="toast" role="status"></div>
  <div class="shead">
    <div class="brand">
      <div><svg width="32" height="32" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#fff"/><circle cx="20" cy="20" r="9" fill="none" stroke="#0B8A5E" stroke-width="2.6"/><path d="M20 6v7M20 27v7M6 20h7M27 20h7" stroke="#0B8A5E" stroke-width="2.6" stroke-linecap="round"/><circle cx="20" cy="20" r="3" fill="#0B8A5E"/></svg><b>LOCUS</b></div>
      <button id="tagbtn" aria-label="Switch site">Level 2 ⇄</button>
    </div>
    <h2 id="s-h">Find equipment fast</h2>
    <div class="sq" id="sq"><label class="sr" for="q">Search</label><input id="q" type="text" placeholder="Search pump, wheelchair, ECG" autocomplete="off"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="#0B8A5E" stroke-width="2"/><path d="M14 14l4 4" stroke="#0B8A5E" stroke-width="2" stroke-linecap="round"/></svg></div>
  </div>
  <div class="schips" id="schips"></div>
  <div class="body" id="v-find"><div id="slist" style="display:flex;flex-direction:column;gap:12px"></div></div>
  <div class="body" id="v-map" hidden><canvas id="fmap" width="720" height="432" aria-label="Live floor map"></canvas><div class="panel" id="msel"></div></div>
  <div class="body" id="v-alerts" hidden>
    <div class="panel"><div class="row"><div id="hsum"></div><span id="hpill" class="pill g">Healthy</span></div></div>
    <div id="hlist" style="display:flex;flex-direction:column;gap:12px"></div>
  </div>
  <div class="tabbar">
    <button class="on" data-v="find"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Find</button>
    <button data-v="map"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/></svg>Map</button>
    <button data-v="alerts"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9a6 6 0 0 1 12 0c0 6 3 7 3 7H3s3-1 3-7zM10 20a2 2 0 0 0 4 0"/></svg>Alerts<span id="badge" hidden>1</span></button>
  </div>
</div></div></div>
<script>
/* ===== LOCUS engine: simulator, baselines, trust scorer, map-aware particle filter ===== */
const FLOOR = { w: 40, h: 24 };
const TOP_DOORS = [5, 15, 25, 35], BOT_DOORS = [6, 17, 27, 36], DOOR_HALF = 1.2;
/* ---- sites: hospital floor and warehouse (same 40 x 24 m footprint) ---- */
let SITE_ID = 'hospital', ROOMS, WALLS, ANCHORS, DROP_ORDER, WAYPOINTS, FALLBACK = 'corr';
function hospitalSite() {
  const rooms = [
    { id: 'wardA', name: 'Ward A', r: [0, 0, 10, 9] }, { id: 'wardB', name: 'Ward B', r: [10, 0, 20, 9] },
    { id: 'icu', name: 'ICU', r: [20, 0, 30, 9] }, { id: 'pharm', name: 'Pharmacy', r: [30, 0, 40, 9] },
    { id: 'corr', name: 'Corridor', r: [0, 9, 40, 15] },
    { id: 'recep', name: 'Reception', r: [0, 15, 12, 24] }, { id: 'store', name: 'Store', r: [12, 15, 22, 24] },
    { id: 'radio', name: 'Radiology', r: [22, 15, 32, 24] }, { id: 'ot', name: 'OT', r: [32, 15, 40, 24] },
  ];
  const W = [], hseg = (y, doors) => { let c = 0; doors.forEach(d => { W.push([c, y, d - DOOR_HALF, y]); c = d + DOOR_HALF; }); W.push([c, y, FLOOR.w, y]); };
  hseg(9, TOP_DOORS); hseg(15, BOT_DOORS);
  [10, 20, 30].forEach(x => W.push([x, 0, x, 9])); [12, 22, 32].forEach(x => W.push([x, 15, x, 24]));
  W.push([0, 0, FLOOR.w, 0], [0, FLOOR.h, FLOOR.w, FLOOR.h], [0, 0, 0, FLOOR.h], [FLOOR.w, 0, FLOOR.w, FLOOR.h]);
  return { rooms, walls: W, fallback: 'corr',
    anchors: [{ id: 'A1', x: 1.5, y: 13.5 }, { id: 'A2', x: 15, y: 1.5 }, { id: 'A3', x: 25, y: 10.5 }, { id: 'A4', x: 38.5, y: 13.5 }, { id: 'A5', x: 28, y: 22.5 }, { id: 'A6', x: 7, y: 22.5 }],
    drop: [2, 5, 1, 3, 0, 4],
    way: [[3, 12], [15, 12], [15, 4], [15, 12], [25, 12], [25, 4], [25, 12], [36, 12], [36, 19.5], [36, 12], [27, 12], [27, 19.5], [27, 12], [6, 12], [6, 19.5], [6, 12]] };
}
function warehouseSite() {
  const rooms = [{ id: 'recv', name: 'Receiving', r: [0, 0, 8, 24] }, { id: 'aisA', name: 'Aisle A', r: [8, 0, 16, 24] }, { id: 'aisB', name: 'Aisle B', r: [16, 0, 24, 24] }, { id: 'aisC', name: 'Aisle C', r: [24, 0, 32, 24] }, { id: 'disp', name: 'Dispatch', r: [32, 0, 40, 24] }];
  const W = []; [8, 16, 24, 32].forEach(x => { W.push([x, 0, x, 10.5], [x, 13.5, x, 24]); });
  [12, 20, 28].forEach(x => { W.push([x - 1.8, 4, x + 1.8, 4], [x - 1.8, 20, x + 1.8, 20]); }); // end-cap shelves
  W.push([0, 0, FLOOR.w, 0], [0, FLOOR.h, FLOOR.w, FLOOR.h], [0, 0, 0, FLOOR.h], [FLOOR.w, 0, FLOOR.w, FLOOR.h]);
  return { rooms, walls: W, fallback: 'recv',
    anchors: [{ id: 'A1', x: 1.5, y: 21 }, { id: 'A2', x: 12, y: 1.5 }, { id: 'A3', x: 20, y: 12 }, { id: 'A4', x: 28, y: 22.5 }, { id: 'A5', x: 38.5, y: 3 }, { id: 'A6', x: 38.5, y: 21 }],
    drop: [2, 5, 1, 3, 0, 4],
    way: [[3, 12], [12, 12], [12, 7], [12, 17], [12, 12], [20, 12], [20, 7], [20, 17], [20, 12], [28, 12], [28, 7], [28, 17], [28, 12], [36, 12], [36, 5], [36, 19], [36, 12]] };
}
function setSite(id) { const S = id === 'warehouse' ? warehouseSite() : hospitalSite(); SITE_ID = id; ROOMS = S.rooms; WALLS = S.walls; ANCHORS = S.anchors; DROP_ORDER = S.drop; WAYPOINTS = S.way; FALLBACK = S.fallback; }
setSite('hospital');

function roomAt(x, y) { for (const r of ROOMS) { const [a, b, c, d] = r.r; if (x >= a && x < c && y >= b && y < d) return r.id; } return FALLBACK; }
function roomName(id) { return ROOMS.find(r => r.id === id).name; }
function segInt(ax, ay, bx, by, cx, cy, dx, dy) {
  const d1x = bx - ax, d1y = by - ay, d2x = dx - cx, d2y = dy - cy;
  const den = d1x * d2y - d1y * d2x; if (Math.abs(den) < 1e-12) return false;
  const t = ((cx - ax) * d2y - (cy - ay) * d2x) / den, u = ((cx - ax) * d1y - (cy - ay) * d1x) / den;
  return t > 1e-6 && t < 1 - 1e-6 && u >= 0 && u <= 1;
}
function wallsBetween(ax, ay, bx, by) { let k = 0; for (const w of WALLS) if (segInt(ax, ay, bx, by, w[0], w[1], w[2], w[3])) k++; return k; }
function crossesWall(ax, ay, bx, by) { for (const w of WALLS) if (segInt(ax, ay, bx, by, w[0], w[1], w[2], w[3])) return true; return false; }

function rngMake(seed) { let a = seed >>> 0; const f = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; f.g = () => { let u = 0, v = 0; while (!u) u = f(); v = f(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }; return f; }

/* Walker along waypoint loop */
class Walker {
  constructor(speed = 1.2, offset = 0) { this.i = 0; this.pos = WAYPOINTS[0].slice(); this.speed = speed; this.vel = [0, 0]; if (offset) this.advance(offset); }
  advance(dist) { while (dist > 0) { const t = WAYPOINTS[(this.i + 1) % WAYPOINTS.length], dx = t[0] - this.pos[0], dy = t[1] - this.pos[1], d = Math.hypot(dx, dy); if (d <= dist) { this.pos = t.slice(); this.i = (this.i + 1) % WAYPOINTS.length; dist -= d; } else { this.pos[0] += dx / d * dist; this.pos[1] += dy / d * dist; dist = 0; } } }
  step(dt) { const o = this.pos.slice(); this.advance(this.speed * dt); this.vel = [(this.pos[0] - o[0]) / dt, (this.pos[1] - o[1]) / dt]; return this.pos; }
}

/* Radio simulator: noise, packet loss, wall (NLOS) bias, dead anchors, drift, forced obstruction */
function measure(pos, anchors, cfg, rng) {
  return anchors.map((a, i) => {
    if (cfg.dead && cfg.dead.has(a.id)) return null;
    if (rng() < cfg.loss) return null;
    const d = Math.hypot(pos[0] - a.x, pos[1] - a.y), k = wallsBetween(a.x, a.y, pos[0], pos[1]);
    let bias = k * cfg.wallBias * (0.5 + rng()), nlos = k > 0;
    if (cfg.obstruct && cfg.obstruct.has(a.id)) { bias += cfg.obstructBias * (0.6 + 0.8 * rng()); nlos = true; }
    if (cfg.burst) { const st = rng._b || (rng._b = {}); if (!st[a.id] && rng() < cfg.burst) st[a.id] = 20 + (rng() * 30 | 0); if (st[a.id] > 0) { st[a.id]--; bias += 3.2; nlos = true; } }
    if (cfg.drift && cfg.drift.has(a.id)) { bias += cfg.driftBias; nlos = true; }
    const sigma = cfg.sigma * (nlos ? 1.8 : 1);
    return { r: Math.max(0.3, d + bias + sigma * rng.g()), nlos, bias };
  });
}

/* Plain trilateration: Gauss-Newton least squares (optionally weighted) */
function lsFix(anchors, meas, init, w) {
  let x = init[0], y = init[1], n = 0;
  for (let it = 0; it < 12; it++) {
    let a11 = 1e-3, a12 = 0, a22 = 1e-3, b1 = 0, b2 = 0; n = 0;
    for (let i = 0; i < anchors.length; i++) {
      const m = meas[i]; if (!m) continue; n++;
      const dx = x - anchors[i].x, dy = y - anchors[i].y, d = Math.max(0.2, Math.hypot(dx, dy)), ux = dx / d, uy = dy / d, res = m.r - d, wt = w ? w[i] : 1;
      a11 += wt * ux * ux; a12 += wt * ux * uy; a22 += wt * uy * uy; b1 += wt * ux * res; b2 += wt * uy * res;
    }
    if (!n) return null;
    const lam = n < 3 ? 0.6 : 0.05, det = (a11 + lam) * (a22 + lam) - a12 * a12;
    x += ((a22 + lam) * b1 - a12 * b2) / det; y += ((a11 + lam) * b2 - a12 * b1) / det;
  }
  return [Math.min(FLOOR.w, Math.max(0, x)), Math.min(FLOOR.h, Math.max(0, y))];
}
/* Baseline B: trilateration + constant-velocity Kalman filter (what most teams build) */
class KalmanCV {
  constructor() { this.x = null; }
  update(z, dt) {
    if (!z) { if (this.x) { this.x[0] += this.x[2] * dt; this.x[1] += this.x[3] * dt; } return this.x ? [this.x[0], this.x[1]] : null; }
    if (!this.x) { this.x = [z[0], z[1], 0, 0]; this.P = [10, 10, 4, 4]; return z.slice(); }
    const q = 0.4 * dt, R = 2.0;
    for (let k = 0; k < 2; k++) {
      let p = this.x[k], v = this.x[k + 2], P = this.P[k], Pv = this.P[k + 2];
      p += v * dt; P += dt * dt * Pv + q; Pv += q;
      const K = P / (P + R), K2 = (Pv * 0.2) / (P + R); const inn = z[k] - p;
      p += K * inn; v += K2 / Math.max(dt, 1e-3) * inn * 0.5; P *= (1 - K);
      this.x[k] = p; this.x[k + 2] = v; this.P[k] = P; this.P[k + 2] = Pv;
    }
    return [this.x[0], this.x[1]];
  }
}

/* wall-count lookup per anchor (0.5 m grid) so the filter can predict wall bias for any particle */
const KCACHE = {};
function kGrid(a) {
  const key = SITE_ID + a.id + ':' + a.x + ',' + a.y; if (KCACHE[key]) return KCACHE[key];
  const W = FLOOR.w * 2, H = FLOOR.h * 2, g = new Uint8Array(W * H);
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) g[j * W + i] = wallsBetween(a.x, a.y, (i + 0.5) / 2, (j + 0.5) / 2);
  return KCACHE[key] = g;
}
function kAt(g, x, y) { const i = Math.min(FLOOR.w * 2 - 1, Math.max(0, x * 2 | 0)), j = Math.min(FLOOR.h * 2 - 1, Math.max(0, y * 2 | 0)); return g[j * FLOOR.w * 2 + i]; }

/* LOCUS: trust scorer + weighted robust fix + map-aware particle filter */
class Locus {
  constructor(anchors, opts = {}) {
    this.anchors = anchors; this.N = opts.N || 600; this.sigma = opts.sigma || 0.6; this.rng = opts.rng || rngMake(7);
    this.inflate = opts.inflate || 1.0; this.wallMu = opts.wallMu || 1.4; this.kg = anchors.map(kGrid);
    this.px = new Float64Array(this.N); this.py = new Float64Array(this.N); this.vx = new Float64Array(this.N); this.vy = new Float64Array(this.N); this.w = new Float64Array(this.N).fill(1 / this.N);
    this.inited = false; this.trust = anchors.map(() => 0.8); this.last = anchors.map(() => null); this.silent = anchors.map(() => 0); this.hist = anchors.map(() => []);
    this.est = null; this.fix = null;
  }
  _init(meas) {
    const c = [FLOOR.w / 2, FLOOR.h / 2], f = lsFix(this.anchors, meas, c) || c, r = this.rng;
    for (let i = 0; i < this.N; i++) { this.px[i] = Math.min(FLOOR.w - .1, Math.max(.1, f[0] + r.g() * 3.5)); this.py[i] = Math.min(FLOOR.h - .1, Math.max(.1, f[1] + r.g() * 3.5)); this.vx[i] = r.g() * .5; this.vy[i] = r.g() * .5; }
    this.inited = true; this.est = f.slice();
  }
  _moments() {
    let mx = 0, my = 0, sw = 0; for (let i = 0; i < this.N; i++) { const q = this.w[i]; mx += q * this.px[i]; my += q * this.py[i]; sw += q; }
    mx /= sw; my /= sw; let sxx = 0, sxy = 0, syy = 0;
    for (let i = 0; i < this.N; i++) { const q = this.w[i], dx = this.px[i] - mx, dy = this.py[i] - my; sxx += q * dx * dx; sxy += q * dx * dy; syy += q * dy * dy; }
    return { mx, my, sxx: sxx / sw, sxy: sxy / sw, syy: syy / sw };
  }
  step(meas, dt) {
    const A = this.anchors, r = this.rng, N = this.N, sg = this.sigma;
    if (!this.inited) { if (!meas.some(Boolean)) return null; this._init(meas); }
    /* 1. predict (motion history) */
    for (let i = 0; i < N; i++) {
      const ox = this.px[i], oy = this.py[i];
      this.vx[i] = this.vx[i] * 0.96 + r.g() * 0.28; this.vy[i] = this.vy[i] * 0.96 + r.g() * 0.28;
