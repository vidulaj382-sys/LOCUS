<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOCUS Staff App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--aqua:#22C3E6;--aqua-d:#0E9DBE;--aqua-l:#BFE9F3;--aqua-xl:#E6F8FC;--em:#10B981;--em-d:#0B8A5E;--em-dd:#0A6B49;--em-l:#DDF6EA;--ink:#0B3A4A;--ink2:#3F6572;--ink3:#7A9AA6;--bg:#F4FCFE;--line:#CDEBF3;--amber-l:#FFF1D6;--coral-l:#FFE3E3;--grad:linear-gradient(135deg,#22C3E6 0%,#10B981 100%)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Figtree',system-ui,sans-serif;color:var(--ink);min-height:100dvh;background:linear-gradient(160deg,#E6F8FC 0%,#DDF6EA 100%)}
h2,b.sora,.item b{font-family:'Sora',sans-serif}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
[hidden]{display:none!important}
.stage{min-height:100dvh;display:grid;place-items:center;padding:24px}
.phone{width:410px;border-radius:50px;background:#0B3A4A;padding:10px;box-shadow:0 40px 80px rgba(11,58,74,.28)}
.screen{border-radius:41px;overflow:hidden;background:var(--bg);height:min(844px,calc(100dvh - 68px));min-height:640px;display:flex;flex-direction:column;position:relative}
.sbar{display:flex;justify-content:space-between;padding:12px 26px 0;font-size:12px;font-weight:700;color:#06303D;background:#22C3E6;background:linear-gradient(135deg,#22C3E6,#14BDB5)}
.shead{padding:14px 20px 20px;background:var(--grad);border-radius:0 0 28px 28px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;justify-content:space-between;align-items:center}
.brand div{display:flex;gap:10px;align-items:center}
.brand b{letter-spacing:.14em;color:#06303D;font-family:'Sora';font-size:17px}
#tagbtn{padding:7px 12px;border-radius:999px;background:#fff;color:var(--em-dd);font-size:13px;font-weight:700}
.shead h2{font-size:26px;color:#06303D;line-height:1.2}
.sq{position:relative}
.sq input{width:100%;height:52px;border:0;border-radius:16px;background:#fff;padding:0 16px 0 46px;font:500 16px 'Figtree';color:var(--ink)}
.sq svg{position:absolute;left:16px;top:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.schips{display:flex;gap:8px;padding:14px 20px 0;overflow-x:auto;flex:none}
.chip{height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--aqua-l);background:#fff;font-size:14px;font-weight:600;flex:none}
.chip[aria-pressed=true]{background:var(--em-d);border-color:var(--em-d);color:#fff}
.body{flex:1;min-height:0;overflow-y:auto;padding:14px 20px 96px;display:flex;flex-direction:column;gap:12px}
.pill{display:inline-flex;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;align-items:center}
.pill.g{background:var(--em-l);color:var(--em-dd)}.pill.a{background:var(--amber-l);color:#8A5A00}.pill.r{background:var(--coral-l);color:#B03030}
.item,.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;width:100%;text-align:left;box-shadow:0 6px 16px rgba(34,195,230,.08);transition:.2s}
.item.sel{border-color:var(--em);box-shadow:0 10px 24px rgba(16,185,129,.2)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item b,.panel b{font-size:16px;font-weight:600}
.item small,.panel small{display:block;color:var(--ink2);font-size:13.5px;margin-top:2px}
canvas.mini,#fmap{display:block;width:100%;margin-top:12px;border-radius:14px;border:1px solid var(--line);aspect-ratio:40/24;background:#fff}
#fmap{margin-top:0}
.go{margin-top:12px;width:100%;height:50px;border-radius:14px;background:var(--grad);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.go.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--aqua-l);height:42px;font-size:14px;margin-top:10px}
.bar{height:8px;border-radius:99px;background:#E7F5F9;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;border-radius:99px;transition:width .35s}
.item.dead{opacity:.75}
.empty{text-align:center;color:var(--ink3);padding:30px 10px;font-size:14px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:76px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;padding-bottom:6px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--ink3);position:relative}
.tabbar button.on{color:var(--em-d)}
#badge{position:absolute;top:10px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:99px;background:#EF6A6A;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.toast{position:absolute;left:14px;right:14px;top:56px;background:#fff;border:1px solid #F5A524;border-left:5px solid #F5A524;border-radius:14px;padding:10px 12px;font-size:13px;box-shadow:0 10px 24px rgba(0,0,0,.14);transform:translateY(-14px);opacity:0;pointer-events:none;transition:.35s;z-index:5}
.toast.on{transform:none;opacity:1}
@media(max-width:480px){.stage{padding:0}.phone{width:100%;border-radius:0;padding:0;box-shadow:none;background:none}.screen{border-radius:0;height:100dvh}.sbar{display:none}.shead{padding-top:max(18px,env(safe-area-inset-top))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="stage"><div class="phone"><div class="screen">
  <div class="sbar"><span>9:41</span><span>●●● 5G ▮</span></div>
  <div class="toast" id="toast" role="status"></div>
  <div class="shead">
    <div class="brand">
      <div><svg width="32" height="32" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#fff"/><circle cx="20" cy="20" r="9" fill="none" stroke="#0B8A5E" stroke-width="2.6"/><path d="M20 6v7M20 27v7M6 20h7M27 20h7" stroke="#0B8A5E" stroke-width="2.6" stroke-linecap="round"/><circle cx="20" cy="20" r="3" fill="#0B8A5E"/></svg><b>LOCUS</b></div>
      <button id="tagbtn" aria-label="Switch site">Level 2 ⇄</button>
    </div>
    <h2 id="s-h">Find equipment fast</h2>
    <div class="sq" id="sq"><label class="sr" for="q">Search</label><input id="q" type="text" placeholder="Search pump, wheelchair, ECG" autocomplete="off"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="#0B8A5E" stroke-width="2"/><path d="M14 14l4 4" stroke="#0B8A5E" stroke-width="2" stroke-linecap="round"/></svg></div>
  </div>
  <div class="schips" id="schips"></div>
  <div class="body" id="v-find"><div id="slist" style="display:flex;flex-direction:column;gap:12px"></div></div>
  <div class="body" id="v-map" hidden><canvas id="fmap" width="720" height="432" aria-label="Live floor map"></canvas><div class="panel" id="msel"></div></div>
  <div class="body" id="v-alerts" hidden>
    <div class="panel"><div class="row"><div id="hsum"></div><span id="hpill" class="pill g">Healthy</span></div></div>
    <div id="hlist" style="display:flex;flex-direction:column;gap:12px"></div>
  </div>
  <div class="tabbar">
    <button class="on" data-v="find"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Find</button>
    <button data-v="map"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/></svg>Map</button>
    <button data-v="alerts"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9a6 6 0 0 1 12 0c0 6 3 7 3 7H3s3-1 3-7zM10 20a2 2 0 0 0 4 0"/></svg>Alerts<span id="badge" hidden>1</span></button>
  </div>
</div></div></div>
<script>
/*__ENGINE__*/
/*__COMMON__*/
/*__APP__*/
/*__BE__*/
</script>
</body>
</html>
